<style>
:root{--orange:#ff7200; --orange2:#ff9f43;}
.course-card-dash{background:#121212; border:1px solid #1e1e1e; border-radius:14px; padding:18px; cursor:pointer; transition:.2s; position:relative; overflow:hidden;}
.course-card-dash:hover{border-color:var(--orange); transform:translateY(-2px);}
.course-card-dash.completed{border-color:#00e676;}
.course-card-dash.completed:before{content:'✓ Completed'; position:absolute; top:10px; right:10px; background:#00e676; color:#000; font-size:9px; padding:3px 8px; border-radius:10px; font-weight:800;}
.course-track{font-size:10px; color:#666; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;}
.course-badge{display:inline-block; padding:3px 8px; border-radius:20px; font-size:10px; font-weight:700; margin-bottom:8px;}
.badge-beginner{background:rgba(0,230,118,.12); color:#00e676; border:1px solid rgba(0,230,118,.2);}
.badge-intermediate{background:rgba(255,114,0,.12); color:#ff7200; border:1px solid rgba(255,114,0,.2);}
.badge-advanced{background:rgba(255,60,60,.12); color:#ff3c3c; border:1px solid rgba(255,60,60,.2);}
.course-progress-bar{height:4px; background:#1e1e1e; border-radius:10px; margin-top:12px; overflow:hidden;}
.course-progress-fill{height:100%; background:var(--orange); width:0%; transition:.3s;}
.xp-badge{background:linear-gradient(135deg,#ff7200,#ff9f43); color:#fff; padding:6px 12px; border-radius:20px; font-weight:700; font-size:12px;}
.lesson-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px;}
#addCourseModal{display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:999; align-items:center; justify-content:center;}
#addCourseModal.active{display:flex;}
</style>

{id:'i2', title:'Music Player UI', description:'Spotify-style player - album art + controls.', difficulty:'intermediate', track:'REAL PROJECTS', order:6, authorName:'Ukid', likes:534, html:'<div class="player">\n <div class="cover">🎵</div>\n <h3>Orange Vibes</h3>\n <p>Ukid Beats</p>\n <div class="controls">\n <button>⏮</button><button id="play">▶</button><button>⏭</button>\n </div>\n</div>', css:'.player{background:#1a1108; border-radius:20px; padding:25px; width:280px; margin:30px auto; text-align:center; border:1px solid #2a1a0a;}\n.cover{width:100%; height:180px; background:linear-gradient(135deg,#ff7200,#ff9f43); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:50px; margin-bottom:15px;}\n.controls{display:flex; gap:10px; justify-content:center;}', js:'', task:'Style the #play button with an orange background and set its width and height to 50px.', validator:'player'},

{id:'i4', title:'Particle Background', description:'Animated particles like homepage.', difficulty:'intermediate', track:'JAVASCRIPT', order:8, authorName:'Ukid', likes:721, html:'<canvas id="c" style="width:100%; height:300px; background:#0f0a05; border-radius:12px;"></canvas>', css:'', js:'const canvas=document.getElementById("c");\nconst ctx=canvas.getContext("2d");\ncanvas.width=600; canvas.height=300;\nlet particles=[];\nfor(let i=0;i<50;i++) particles.push({x:Math.random()*600, y:Math.random()*300, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2});\nfunction draw(){ctx.clearRect(0,0,600,300); particles.forEach(p=>{p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>600) p.vx*=-1; if(p.y<0||p.y>300) p.vy*=-1; ctx.fillStyle="#ff7200"; ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill();}); requestAnimationFrame(draw);} draw();', task:'Add lines between close particles', validator:'canvas'},

{id:'a3', title:'Validate a Signup Form', description:'Use labelled fields and JavaScript submit events to give useful feedback.', difficulty:'advanced', track:'JAVASCRIPT', order:11, authorName:'Ukid', likes:0, html:'<form id="signup-form">\n  <label for="email">Email address</label>\n  <input id="email" name="email" type="email" autocomplete="email" required>\n  <button type="submit">Join the list</button>\n</form>\n<p id="form-status" role="status" aria-live="polite"></p>', css:'body{max-width:480px;margin:48px auto;padding:20px;background:#0b0e14;color:#f4f6fb;font-family:system-ui,sans-serif;}\nlabel,input,button{display:block;width:100%;margin:12px 0;}\ninput,button{padding:12px;border-radius:8px;}\nbutton{border:0;background:#ff8738;color:#24140b;font-weight:700;cursor:pointer;}', js:'const form = document.querySelector("#signup-form");\nconst status = document.querySelector("#form-status");\n\nform.addEventListener("submit", (event) => {\n  // Prevent a page reload and show feedback after a valid submission.\n});', task:'1. Call event.preventDefault() inside the submit handler.\n2. Set the status paragraph textContent to a success message.\n3. Try submitting an empty or invalid email and notice the browser validation.', validator:'form-validation'},
{id:'a4', title:'Remember a Theme Choice', description:'Persist a simple light and dark theme preference with localStorage.', difficulty:'advanced', track:'JAVASCRIPT', order:12, authorName:'Ukid', likes:0, html:'<main class="settings">\n  <h1>Display settings</h1>\n  <p>Choose a theme. Your choice will remain after refreshing.</p>\n  <button id="theme-toggle" type="button" aria-pressed="false">Use light theme</button>\n</main>', css:'body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111722;color:#f4f6fb;font-family:system-ui,sans-serif;transition:background .2s,color .2s;}\n.settings{max-width:420px;padding:28px;border:1px solid #30394a;border-radius:16px;}\nbutton{padding:10px 14px;border:0;border-radius:8px;background:#ff8738;color:#24140b;font-weight:700;cursor:pointer;}\nbody.light-theme{background:#f4f6fb;color:#182131;}', js:'const themeButton = document.querySelector("#theme-toggle");\n\n// Restore the saved choice when the page loads.\n// Add a click listener that toggles body.light-theme and saves the choice.', task:'1. Read the saved theme from localStorage when the page starts.\n2. Add a click listener that toggles the light-theme class on body.\n3. Save the new choice with localStorage.setItem and update aria-pressed.', validator:'storage'},
{id:'a5', title:'Build Semantic Navigation', description:'Structure site navigation with landmarks, lists, and a descriptive accessible name.', difficulty:'intermediate', track:'HTML BASICS', order:13, authorName:'Ukid', likes:0, html:'<header>\n  <a href="/" class="brand">Studio</a>\n  <!-- Add a labelled nav and a list of page links. -->\n</header>', css:'body{margin:0;background:#0b0e14;color:#f4f6fb;font-family:system-ui,sans-serif;}\nheader{display:flex;align-items:center;justify-content:space-between;padding:20px 5%;}\n.brand{color:#ff8738;font-weight:800;text-decoration:none;}\na{color:inherit;text-decoration:none;}\na:focus-visible{outline:3px solid #ff8738;outline-offset:4px;}', js:'', task:'Add a <nav aria-label="Main navigation"> containing a <ul> with list items and links for Home, Projects, and Contact. Use real section IDs in the href values.', validator:'semantic'},

let allLessons=[...REAL_LESSONS]; let currentFilter='all'; let currentTrack='all';
function getProgress(){return JSON.parse(localStorage.getItem('ukid_progress')||'[]');}
function updateUI(){const p=getProgress(); const pct=Math.round(p.length/REAL_LESSONS.length*100); document.getElementById('xpText').innerText=`${p.length*100} XP`; document.getElementById('xpBadge').innerText=`${p.length*100} XP`; document.getElementById('progressText').innerText=`${p.length}/${REAL_LESSONS.length} lessons completed`; document.getElementById('mainProgress').style.width=pct+'%';}
async function loadLessons(){
 try{ const snap=await getDocs(query(collection(db,'lessons'), where('isApproved','==',true))); const fb=snap.docs.map(d=>({id:d.id,...d.data()})); if(fb.length>0) allLessons=[...REAL_LESSONS,...fb]; }catch(e){console.error('Unable to load community lessons:',e);}
 document.getElementById('countText').innerText=`${allLessons.length} lessons • ${REAL_LESSONS.length} core + community`; updateUI(); render(allLessons);
}
function render(list){
 const progress=getProgress();
 document.getElementById('coursesGrid').innerHTML=list.sort((a,b)=>(a.order||99)-(b.order||99)).map(c=>`
  <div class="course-card-dash ${progress.includes(c.id)?'completed':''}" onclick="openCourse('${c.id}')">
   <div class="course-track">${c.track||''} • #${c.order||''}</div>
   <span class="course-badge badge-${c.difficulty}">${c.difficulty.toUpperCase()}</span>
   <h3 style="font-size:15px; margin:8px 0;">${c.title}</h3>
   <p style="color:#666; font-size:12px; height:32px; overflow:hidden;">${c.description||''}</p>
   <div style="display:flex; justify-content:space-between; color:#444; font-size:11px; border-top:1px solid #1e1e1e; padding-top:10px; margin-top:10px;"><span>👤 ${c.authorName||'Anon'}</span><span style="color:#ff7200;">Learn →</span></div>
  </div>`).join('');
}
window.setFilter=(f,btn)=>{currentFilter=f; document.querySelectorAll('.categories .category-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilters();}
window.filterByTrack=()=>{currentTrack=document.getElementById('trackSelect').value; applyFilters();}
window.filterCourses=()=>applyFilters();
function applyFilters(){
 const q=document.getElementById('searchInput').value.toLowerCase();
 let filtered=allLessons.filter(l=>{
  const mf=currentFilter==='all'||l.difficulty===currentFilter;
  const mt=currentTrack==='all'||l.track===currentTrack;
  const ms=(l.title+l.description).toLowerCase().includes(q);
  return mf&&mt&&ms;
 });
 render(filtered);
 document.getElementById('countText').innerText=`${filtered.length} lessons found`;
}
window.openCourse=(id)=>{localStorage.setItem('currentLessonId', id); location.href=`academy.html?lesson=${id}`;}
window.openAddModal=()=>document.getElementById('addCourseModal').classList.add('active');
window.closeAddModal=()=>document.getElementById('addCourseModal').classList.remove('active');
window.submitLesson=async()=>{
 if(!currentUser) return alert('Sign in before submitting a lesson.');
 const data={title:mTitle.value.trim(), description:mDesc.value.trim(), difficulty:mDiff.value, track:mTrack.value, task:mTask.value.trim(), html:mHtml.value, css:mCss.value, js:mJs.value, order:99, authorName:currentUser.displayName||'Anonymous', authorId:currentUser.uid, likes:0, isApproved:false, createdAt:serverTimestamp(), validator:'h1'};
 if(!data.title||!data.task) return alert('Title + Task required');
 try{ await addDoc(collection(db,'lessons'), data); alert('Submitted for review 🔶'); closeAddModal(); }catch(e){console.error('Unable to submit lesson:',e);alert(`Unable to submit lesson: ${e.message}`);}
}
const courseSidebar=document.getElementById('dashboardSidebar');
const courseOverlay=document.getElementById('sidebarOverlay');
function closeCourseSidebar(){courseSidebar?.classList.remove('active');courseOverlay?.classList.remove('active');}
document.getElementById('mobileMenu')?.addEventListener('click', ()=>{courseSidebar?.classList.add('active');courseOverlay?.classList.add('active');});
document.getElementById('mobileClose')?.addEventListener('click', closeCourseSidebar);
courseOverlay?.addEventListener('click', closeCourseSidebar);
loadLessons();
</script>
<script type="module" src="templates.js"></script>
