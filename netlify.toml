[build]
  command = "npm run build:site"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/auth-otp"
  to = "/.netlify/functions/auth-otp"
  status = 200

[[redirects]]
  from = "/__/auth/*"
  to = "https://ukid-9b170.firebaseapp.com/__/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/learn/*"
  to = "/.netlify/functions/learn-assistant/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
